<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b1e">
  <title>きょうもゲーセン。</title>
  <link rel="stylesheet" href="style.css">
  <script>
    /* 開発用デバッグ画面(Eruda)：URLの末尾に ?debug=1 を付けたときだけ読み込む。?debug=0 で解除。付けなければ何も起きない */
    (function () {
      try {
        var m = /[?&]debug=([01])/.exec(location.search);
        if (m) localStorage.setItem('piyo-debug', m[1]);
        if (localStorage.getItem('piyo-debug') === '1') {
          document.write('<script src="https://cdn.jsdelivr.net/npm/eruda@3.4.1/eruda.js"><\/script><script>window.eruda && eruda.init();<\/script>');
        }
      } catch (e) { /* 何もしない */ }
    })();
  </script>
</head>
<body>
  <div id="app">
    <main id="stage">
      <div id="floor-header" class="floor-header" aria-hidden="true"><span class="fh-day"></span><span class="fh-rows"><span class="fh-row"><i>YEN</i><b class="fh-yen"></b></span><span class="fh-row"><i>MEDAL</i><b class="fh-medal"></b></span></span></div>
      <div id="screen" class="screen">
        <div id="boot" class="boot" aria-hidden="true"><div id="boot-art" class="boot-art"></div><div class="boot-bar"><i></i></div><div id="boot-msg" class="boot-msg"></div></div>
        <canvas id="game" style="visibility:hidden" width="180" height="384" aria-label="ドット絵のメダルゲーム画面"></canvas>
        <div id="tvmsg" class="tv-msg" aria-live="polite"></div>
        <button id="retry" class="pixel-btn retry-btn" type="button">ゲームセンターへ戻る</button>
        <button id="ham-start" class="pixel-btn ham-btn ham-start" type="button"><span class="ham-main">START</span><span class="ham-sub">1 MEDAL</span></button>
        <button id="ham-stop" class="pixel-btn ham-btn ham-stop" type="button"><span class="ham-main">降りる</span><span class="ham-sub">+0 MEDALS</span></button>
        <button id="ham-go" class="pixel-btn ham-btn ham-go" type="button"><span class="ham-main">進む！</span><span class="ham-sub">NEXT</span></button>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
          <div class="dialog-card">
            <p id="dialog-title" class="dialog-title"></p>
            <div id="dialog-body" class="dialog-body"></div>
            <div id="dialog-buttons" class="dialog-buttons"></div>
          </div>
        </div>
      </div>
    </main>
    <footer id="bar">
      <p id="hint" class="hint">触って選ぼう</p>
      <button id="help" class="pixel-btn stand-btn" type="button" hidden>あそびかた</button>
      <button id="stand" class="pixel-btn stand-btn" type="button" hidden>席を立つ</button>
      <button id="sound" class="pixel-btn sound-btn" type="button" aria-label="効果音のオン・オフ" aria-pressed="true">音 ON</button>
    </footer>
  </div>
  <script>
    /* 起動まちの画面：ドット文字の「NOW LOADING...」。よみこみが止まったら、リロードをうながす（ゲーム本体のファイルより先に動く、小さな部品） */
    (function () {
      var G = { '.': '000000000000010', ' ': '000000000000000', '!': '010010010000010',
        A: '010101111101101', C: '111100100100111', D: '110101101101110', E: '111100111100111', F: '111100110100100', G: '111100101101111', I: '111010010010111',
        L: '100100100100111', M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100', R: '110101110101101',
        S: '011100010001110', T: '111010010010010', U: '101101101101111', W: '101101111111101', Y: '101101010010010', K: '101110100110101', H: '101101111101101' };
      function dot(text, sc, color) {
        var c = document.createElement('canvas'); c.width = text.length * 4 * sc; c.height = 5 * sc; c.className = 'boot-dot'; var g = c.getContext('2d'); g.fillStyle = color;
        for (var n = 0; n < text.length; n++) { var gl = G[text.charAt(n)] || G[' ']; for (var k = 0; k < 15; k++) if (gl.charAt(k) === '1') g.fillRect((n * 4 + (k % 3)) * sc, Math.floor(k / 3) * sc, sc, sc); }
        return c;
      }
      var art = document.getElementById('boot-art'); var msg = document.getElementById('boot-msg'); if (!art || !msg) return;
      art.appendChild(dot('GAME CENTER', 2, '#ff9ad8')); art.appendChild(dot('NEW COSMO', 3, '#ffe9a0')); msg.appendChild(dot('NOW LOADING...', 2, '#5ce8ff'));
      var failed = false;
      function fail() {
        if (failed) return; var b = document.getElementById('boot'); if (!b) return; failed = true; b.classList.add('is-failed'); msg.innerHTML = '';
        msg.appendChild(dot('LOAD STOPPED', 2, '#ff9ab0')); msg.appendChild(dot('PLEASE RELOAD', 2, '#ffe9a0'));
        var t = document.createElement('p'); t.className = 'boot-jp'; t.textContent = 'うまく よみこめなかったみたい。 もういちど よみこんでね'; msg.appendChild(t);
        var bt = document.createElement('button'); bt.type = 'button'; bt.className = 'pixel-btn boot-reload'; bt.textContent = 'リロードする'; bt.addEventListener('click', function () { location.reload(); }); msg.appendChild(bt);
      }
      window.addEventListener('error', function (e) { var t = e.target; if (t && t.tagName === 'SCRIPT') fail(); else if (document.getElementById('boot')) fail(); }, true);
      setTimeout(fail, 12000);
    })();
  </script>
